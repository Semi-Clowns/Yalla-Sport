name: iOS Build

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    name: Build using Xcode 13.2.1
    # macOS 13 (Ventura) is the last runner that supports Xcode 13.2.1
    runs-on: macos-13 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 13.2.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '13.2.1'

      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          # Try to parse the first target, or fallback to an empty string
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]" || echo "")
          
          if [ -z "$default" ]; then
            # IMPORTANT: If your scheme name isn't SportsApplication, change it here!
            default="SportsApplication"
          fi
          
          echo $default > default
          echo "Using default scheme: $default"

      - name: Build
        run: |
          # iPhone 13 is the safest simulator for Xcode 13
          device="iPhone 13"
          scheme=$(cat default)
          
          # Logic to detect if we should use .xcworkspace or .xcodeproj
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then 
            filetype_parameter="workspace"
            file_to_build="`ls -A | grep -i \\.xcworkspace\$ | head -1`"
          else 
            filetype_parameter="project"
            file_to_build="`ls -A | grep -i \\.xcodeproj\$ | head -1`"
          fi
          
          # Clean up the string for xcodebuild
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          
          xcodebuild build -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=iOS Simulator,name=$device"
