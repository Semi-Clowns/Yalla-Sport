jobs:
  build:
    name: Build using Xcode 13.2.1
    # macOS 14 runners are much more plentiful and start faster
    runs-on: macos-14 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # This action is the "Golden Standard" for finding old Xcodes on new runners
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '13.2.1'

      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default > default
          echo "Using default scheme: $default"

      - name: Build
        run: |
          device="iPhone 13"
          scheme=$(cat default)
          
          # Detect workspace vs project
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then 
            filetype_parameter="workspace"
            file_to_build="`ls -A | grep -i \\.xcworkspace\$ | head -1`"
          else 
            filetype_parameter="project"
            file_to_build="`ls -A | grep -i \\.xcodeproj\$ | head -1`"
          fi
          
          xcodebuild build -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=iOS Simulator,name=$device"
