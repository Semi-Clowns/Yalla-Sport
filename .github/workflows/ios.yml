name: iOS starter workflow

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    name: Build using Xcode 13.2.1
    # Xcode 13.2.1 works best on macOS 12
    runs-on: macos-12 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 13.2.1
        run: |
          # This command tells the runner which Xcode version to use
          sudo xcode-select -s /Applications/Xcode_13.2.1.app/Contents/Developer
          xcodebuild -version

      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default > default
          echo "Using default scheme: $default"

      - name: Build
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: |
          # Xcode 13 uses 'instruments -s devices' or 'xcrun simctl'
          # Let's pick a standard iPhone 13 simulator which was common for Xcode 13
          device="iPhone 13"
          
          if [ $scheme = default ]; then scheme=$(cat default); fi
          
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then 
            filetype_parameter="workspace"
            file_to_build="`ls -A | grep -i \\.xcworkspace\$ | head -1`"
          else 
            filetype_parameter="project"
            file_to_build="`ls -A | grep -i \\.xcodeproj\$ | head -1`"
          fi
          
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          
          xcodebuild build -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,name=$device"
