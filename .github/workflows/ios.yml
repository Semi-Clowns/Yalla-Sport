name: iOS Build Check

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    name: Build Success Check
    runs-on: macos-13 # The only runner that reliably supports Xcode 13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode 13.2.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '13.2.1'

      - name: Build Project
        run: |
          # 1. Identify your Workspace or Project
          # If you use CocoaPods, use -workspace SportsApplication.xcworkspace
          # If you DON'T use pods, use -project SportsApplication.xcodeproj
          
          xcodebuild build \
            -project SportsApplication.xcodeproj \
            -scheme SportsApplication \
            -destination "platform=iOS Simulator,name=iPhone 13" \
            -quiet
